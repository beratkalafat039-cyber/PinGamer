<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - E-Pin Pazaryeri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center" style="min-height: 100vh;">

<div class="container" style="max-width: 400px;">
    <div class="card bg-secondary text-white p-4 shadow-lg border-0 rounded-4">
        <h3 class="text-center fw-bold text-danger mb-4">🎮 HESAP OLUŞTUR</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} p-2 small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label small">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" required placeholder="Kullanıcı adınızı seçin">
            </div>
            <div class="mb-4">
                <label class="form-label small">Şifre</label>
                <input type="password" name="password" class="form-control" required placeholder="Şifrenizi belirleyin">
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Kayıt Ol</button>
        </form>

        <div class="text-center mt-3 small">
            Zaten hesabın var mı? <a href="/login" class="text-warning text-decoration-none fw-bold">Giriş Yap</a>
        </div>
    </div>
</div>

</body>
</html>
