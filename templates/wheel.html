<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 VP Şans Slotu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .slot-box {
            background: #1a1a2e;
            border: 3px solid #e94560;
            border-radius: 16px;
            padding: 24px 12px;
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.4);
        }
        .slot-display {
            font-size: 2.3rem;
            font-weight: 900;
            background: #0f3460;
            color: #e94560;
            border-radius: 10px;
            padding: 20px 10px;
            letter-spacing: 1px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.8);
            word-break: break-word;
        }
        .tier-card {
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .tier-card:hover, .tier-card.active {
            transform: translateY(-3px);
            border-color: #ffc107;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }
        @media (min-width: 768px) {
            .slot-box {
                padding: 40px 20px;
                border-width: 4px;
                border-radius: 20px;
            }
            .slot-display {
                font-size: 3.5rem;
                min-height: 150px;
                padding: 30px;
            }
        }
    </style>
</head>
<body class="bg-dark text-white">

<div class="container py-3 py-md-4 text-center">
    <!-- Üst Başlık ve Bakiye -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <a href="/" class="btn btn-outline-light btn-sm">← Mağaza</a>
        <h4 class="fw-bold text-danger m-0">🎰 VP ŞANS ÇARKI</h4>
        <span class="badge bg-success fs-6">Bakiye: <span id="user-balance">{{ "%.2f"|format(balance) }}</span> TL</span>
    </div>

    <!-- Kasa Seçenekleri -->
    <div class="row g-2 g-md-3 mb-3 justify-content-center">
        <div class="col-4 col-md-3">
            <div class="card bg-secondary text-white p-2 p-md-3 tier-card active h-100" onclick="selectTier('bronze', this)">
                <div class="fw-bold small">🥉 Bronz</div>
                <h5 class="text-warning my-1">50 TL</h5>
                <small class="text-light d-none d-md-block">150 - 1.200 VP</small>
            </div>
        </div>
        <div class="col-4 col-md-3">
            <div class="card bg-secondary text-white p-2 p-md-3 tier-card h-100" onclick="selectTier('silver', this)">
                <div class="fw-bold small">🥈 Gümüş</div>
                <h5 class="text-warning my-1">150 TL</h5>
                <small class="text-light d-none d-md-block">2.480 - 5.350 VP</small>
            </div>
        </div>
        <div class="col-4 col-md-3">
            <div class="card bg-secondary text-white p-2 p-md-3 tier-card h-100" onclick="selectTier('gold', this)">
                <div class="fw-bold small">👑 VIP</div>
                <h5 class="text-warning my-1">300 TL</h5>
                <small class="text-light d-none d-md-block">11.000 VP Şansı</small>
            </div>
        </div>
    </div>

    <!-- Slot Ekranı -->
    <div class="row justify-content-center mb-3">
        <div class="col-12 col-md-8">
            <div class="slot-box">
                <div class="slot-display mb-3" id="slot-screen">
                    ??? VP
                </div>

                <!-- Butonlar -->
                <div class="d-flex justify-content-center gap-2 flex-column flex-sm-row">
                    <button class="btn btn-danger btn-lg py-2 py-md-3 px-4 fw-bold fs-5" id="spin-btn" onclick="startSpin(false)">
                        🎰 GERÇEK ÇEVİR
                    </button>
                    <button class="btn btn-warning btn-lg py-2 py-md-3 px-3 fw-bold fs-6 text-dark" id="test-btn" onclick="startSpin(true)">
                        🧪 ÜCRETSİZ TEST ET
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sonuç Bildirimi -->
    <div id="result-box" class="d-none alert alert-success p-3 rounded-3 shadow">
        <h5 class="fw-bold m-0" id="reward-title"></h5>
        <div id="code-area">
            <p class="small mb-1 mt-2">Teslim Edilen Dijital Kodunuz:</p>
            <div class="badge bg-dark fs-5 p-2 text-warning border border-warning" id="reward-code"></div>
            <div class="mt-2">
                <a href="/orders" class="btn btn-primary btn-sm">Siparişlerimde Gör</a>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedTier = 'bronze';
    const vpPool = ["150 VP", "600 VP", "1200 VP", "2480 VP", "5350 VP", "11000 VP"];
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450 + Math.random() * 200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playWinSound() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            const startTime = audioCtx.currentTime + (index * 0.12);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.6);
        });
    }

    function selectTier(tier, element) {
        selectedTier = tier;
        document.querySelectorAll('.tier-card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
    }

    function getRandomVpForTest(tier) {
        const options = [
            { vp: "150 VP", weight: tier === 'bronze' ? 55 : (tier === 'silver' ? 15 : 5) },
            { vp: "600 VP", weight: tier === 'bronze' ? 30 : (tier === 'silver' ? 35 : 15) },
            { vp: "1200 VP", weight: tier === 'bronze' ? 10 : (tier === 'silver' ? 30 : 35) },
            { vp: "2480 VP", weight: tier === 'bronze' ? 4 : (tier === 'silver' ? 14 : 25) },
            { vp: "5350 VP", weight: tier === 'bronze' ? 0.9 : (tier === 'silver' ? 5 : 15) },
            { vp: "11000 VP", weight: tier === 'bronze' ? 0.1 : (tier === 'silver' ? 1 : 5) }
        ];
        let totalWeight = options.reduce((sum, item) => sum + item.weight, 0);
        let randomNum = Math.random() * totalWeight;
        for (let item of options) {
            if (randomNum < item.weight) return item.vp;
            randomNum -= item.weight;
        }
        return "150 VP";
    }

    function startSpin(isTest = false) {
        initAudio();
        const spinBtn = document.getElementById('spin-btn');
        const testBtn = document.getElementById('test-btn');
        const screen = document.getElementById('slot-screen');
        const resultBox = document.getElementById('result-box');
        const codeArea = document.getElementById('code-area');

        spinBtn.disabled = true;
        testBtn.disabled = true;
        resultBox.classList.add('d-none');

        const animation = setInterval(() => {
            screen.innerText = vpPool[Math.floor(Math.random() * vpPool.length)];
            playClickSound();
        }, 80);

        if (isTest) {
            setTimeout(() => {
                clearInterval(animation);
                spinBtn.disabled = false;
                testBtn.disabled = false;
                const wonVP = getRandomVpForTest(selectedTier);
                screen.innerText = wonVP;
                playWinSound();
                resultBox.className = "alert alert-warning p-3 rounded-3 shadow";
                document.getElementById('reward-title').innerHTML = `🧪 <strong>TEST:</strong> ${wonVP} çıktı! (Bakiye düşmedi)`;
                codeArea.classList.add('d-none');
                resultBox.classList.remove('d-none');
            }, 2000);
        } else {
            fetch('/spin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tier: selectedTier })
            })
            .then(res => res.json())
            .then(data => {
                setTimeout(() => {
                    clearInterval(animation);
                    spinBtn.disabled = false;
                    testBtn.disabled = false;
                    if (data.success) {
                        screen.innerText = data.reward;
                        document.getElementById('user-balance').innerText = data.new_balance;
                        playWinSound();
                        resultBox.className = "alert alert-success p-3 rounded-3 shadow";
                        document.getElementById('reward-title').innerText = "🎉 TEBRİKLER! " + data.reward_label + " KAZANDINIZ!";
                        document.getElementById('reward-code').innerText = data.code;
                        codeArea.classList.remove('d-none');
                        resultBox.classList.remove('d-none');
                    } else {
                        screen.innerText = "HATA!";
                        alert(data.error);
                    }
                }, 2500);
            })
            .catch(err => {
                clearInterval(animation);
                spinBtn.disabled = false;
                testBtn.disabled = false;
                alert("Bağlantı hatası oluştu!");
            });
        }
    }
</script>

</body>
</html>
