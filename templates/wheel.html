<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 VP Şans Slotu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .slot-box {
            background: #1a1a2e;
            border: 4px solid #e94560;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
        }
        .slot-display {
            font-size: 3.5rem;
            font-weight: 900;
            background: #0f3460;
            color: #e94560;
            border-radius: 12px;
            padding: 30px;
            letter-spacing: 2px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.8);
            transition: all 0.2s;
        }
        .tier-card {
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .tier-card:hover, .tier-card.active {
            transform: translateY(-5px);
            border-color: #ffc107;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }
    </style>
</head>
<body class="bg-dark text-white">

<div class="container py-4 text-center">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/" class="btn btn-outline-light">← Mağazaya Dön</a>
        <h2 class="fw-bold text-danger m-0">🎰 VP ŞANS ÇARKI / SLOT</h2>
        <span class="badge bg-success fs-5">Bakiye: <span id="user-balance">{{ "%.2f"|format(balance) }}</span> TL</span>
    </div>

    <!-- Kasa Seçenekleri -->
    <div class="row g-3 mb-4 justify-content-center">
        <div class="col-md-3">
            <div class="card bg-secondary text-white p-3 tier-card active" onclick="selectTier('bronze', this)">
                <h5 class="fw-bold">🥉 Bronz Slot</h5>
                <h3 class="text-warning">50 TL</h3>
                <small class="text-light">150 - 1.200 VP İhtimali</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-secondary text-white p-3 tier-card" onclick="selectTier('silver', this)">
                <h5 class="fw-bold">🥈 Gümüş Slot</h5>
                <h3 class="text-warning">150 TL</h3>
                <small class="text-light">Yüksek 2.480 & 5.350 VP Şansı</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-secondary text-white p-3 tier-card" onclick="selectTier('gold', this)">
                <h5 class="fw-bold">👑 Altın VIP Slot</h5>
                <h3 class="text-warning">300 TL</h3>
                <small class="text-light">🔥 En Yüksek 11.000 VP Şansı</small>
            </div>
        </div>
    </div>

    <!-- Slot Ekranı -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-8">
            <div class="slot-box">
                <div class="slot-display mb-4" id="slot-screen">
                    ??? VP
                </div>

                <!-- Butonlar -->
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button class="btn btn-danger btn-lg px-5 py-3 fw-bold fs-4" id="spin-btn" onclick="startSpin(false)">
                        🎰 GERÇEK ÇEVİR
                    </button>
                    
                    <button class="btn btn-warning btn-lg px-4 py-3 fw-bold fs-5 text-dark" id="test-btn" onclick="startSpin(true)">
                        🧪 ÜCRETSİZ TEST ET
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sonuç Bildirimi -->
    <div id="result-box" class="d-none alert alert-success p-4 rounded-4 shadow">
        <h3 class="fw-bold" id="reward-title"></h3>
        <div id="code-area">
            <p class="fs-5 mb-1">Teslim Edilen Dijital Kodunuz:</p>
            <div class="badge bg-dark fs-4 p-3 text-warning border border-warning" id="reward-code"></div>
            <div class="mt-3">
                <a href="/orders" class="btn btn-primary">Siparişlerimde Gör</a>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedTier = 'bronze';
    const vpPool = ["150 VP", "600 VP", "1200 VP", "2480 VP", "5350 VP", "11000 VP"];

    // Web Audio API Ses Sentezleyicisi
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // Mekanik Slot Tıklama Sesi
    function playClickSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450 + Math.random() * 200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    // Zafer / Kazanma Melodisi
    function playWinSound() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 akoru
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.value = freq;

            const startTime = audioCtx.currentTime + (index * 0.12);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + 0.6);
        });
    }

    function selectTier(tier, element) {
        selectedTier = tier;
        document.querySelectorAll('.tier-card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
    }

    function getRandomVpForTest(tier) {
        const options = [
            { vp: "150 VP", weight: tier === 'bronze' ? 55 : (tier === 'silver' ? 15 : 5) },
            { vp: "600 VP", weight: tier === 'bronze' ? 30 : (tier === 'silver' ? 35 : 15) },
            { vp: "1200 VP", weight: tier === 'bronze' ? 10 : (tier === 'silver' ? 30 : 35) },
            { vp: "2480 VP", weight: tier === 'bronze' ? 4 : (tier === 'silver' ? 14 : 25) },
            { vp: "5350 VP", weight: tier === 'bronze' ? 0.9 : (tier === 'silver' ? 5 : 15) },
            { vp: "11000 VP", weight: tier === 'bronze' ? 0.1 : (tier === 'silver' ? 1 : 5) }
        ];

        let totalWeight = options.reduce((sum, item) => sum + item.weight, 0);
        let randomNum = Math.random() * totalWeight;

        for (let item of options) {
            if (randomNum < item.weight) return item.vp;
            randomNum -= item.weight;
        }
        return "150 VP";
    }

    function startSpin(isTest = false) {
        initAudio(); // Tarayıcı ses motorunu tetikle

        const spinBtn = document.getElementById('spin-btn');
        const testBtn = document.getElementById('test-btn');
        const screen = document.getElementById('slot-screen');
        const resultBox = document.getElementById('result-box');
        const codeArea = document.getElementById('code-area');

        spinBtn.disabled = true;
        testBtn.disabled = true;
        resultBox.classList.add('d-none');

        // Slot dönme animasyonu ve tık sesleri
        const animation = setInterval(() => {
            screen.innerText = vpPool[Math.floor(Math.random() * vpPool.length)];
            playClickSound();
        }, 80);

        if (isTest) {
            setTimeout(() => {
                clearInterval(animation);
                spinBtn.disabled = false;
                testBtn.disabled = false;

                const wonVP = getRandomVpForTest(selectedTier);
                screen.innerText = wonVP;
                playWinSound();

                resultBox.className = "alert alert-warning p-4 rounded-4 shadow";
                document.getElementById('reward-title').innerHTML = `🧪 <strong>TEST SİMÜLASYONU:</strong> Şansınıza <strong>${wonVP}</strong> çıktı! (Bakiye düşmedi)`;
                codeArea.classList.add('d-none');
                resultBox.classList.remove('d-none');
            }, 2000);
        } else {
            fetch('/spin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tier: selectedTier })
            })
            .then(res => res.json())
            .then(data => {
                setTimeout(() => {
                    clearInterval(animation);
                    spinBtn.disabled = false;
                    testBtn.disabled = false;

                    if (data.success) {
                        screen.innerText = data.reward;
                        document.getElementById('user-balance').innerText = data.new_balance;
                        playWinSound();
                        
                        resultBox.className = "alert alert-success p-4 rounded-4 shadow";
                        document.getElementById('reward-title').innerText = "🎉 TEBRİKLER! " + data.reward_label + " KAZANDINIZ!";
                        document.getElementById('reward-code').innerText = data.code;
                        codeArea.classList.remove('d-none');
                        resultBox.classList.remove('d-none');
                    } else {
                        screen.innerText = "HATA!";
                        alert(data.error);
                    }
                }, 2500);
            })
            .catch(err => {
                clearInterval(animation);
                spinBtn.disabled = false;
                testBtn.disabled = false;
                alert("Bağlantı hatası oluştu!");
            });
        }
    }
</script>

</body>
</html>
