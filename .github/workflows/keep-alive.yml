name: Render Keep Alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Site
        run: |
          echo "Ping atiliyor: $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" https://epin-projesi1.onrender.com/health)
          echo "Yanit Kodu: $response"
          if [ "$response" != "200" ]; then
            echo "Site yanit vermedi! Kod: $response"
            exit 1
          else
            echo "Site aktif!"
          fi
